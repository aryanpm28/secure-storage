# Server
server.port=8080

# Database - override via environment variables rather than editing this
# file directly, so real credentials never end up committed to git.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/secure_storage?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File upload — 100MB covers the largest allowed category (video). The
# service layer (FileStorageService) enforces the real, tighter per-category
# limits on top of this outer ceiling: 5MB images, 20MB documents, 100MB video.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Backblaze B2
b2.endpoint=${B2_ENDPOINT:https://s3.us-east-005.backblazeb2.com}
b2.region=${B2_REGION:us-east-005}
b2.bucket=${B2_BUCKET:secure-storage-files}
b2.key-id=${B2_KEY_ID:}
b2.application-key=${B2_APPLICATION_KEY:}

# JWT — the default below is fine for local dev only. Before you ever
# deploy this anywhere public, set a real JWT_SECRET environment variable
# (generate one with: openssl rand -hex 48) so it isn't the same value
# every clone of this repo shares.
jwt.secret=${JWT_SECRET:SecureStorageSecretKeyThatIsLongEnoughForHS256Algorithm123456}
jwt.expiration-ms=86400000

# Custom security filter settings
security.block.threshold=5
security.block.duration-minutes=30

# Per-user storage quota — 10GB default
storage.max-bytes-per-user=${STORAGE_QUOTA_BYTES:10737418240}

# Frontend base URL for share links
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
